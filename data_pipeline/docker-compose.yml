services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xom}
      POSTGRES_DB: ${POSTGRES_DB:-xom}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xom} -d ${POSTGRES_DB:-xom}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped


  # One Kafka broker in KRaft mode (no ZooKeeper). Containers reach it at kafka:19092; the host
  # at 127.0.0.1:${KAFKA_PORT}, never on a public interface. Topics are not auto-created:
  # kafka-init creates raw.ecom_records once.
  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 10
    restart: unless-stopped

  # Creates the topic explicitly, then exits. Safe to re-run (--if-not-exists).
  kafka-init:
    image: apache/kafka:4.1.0
    command:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - kafka:19092
      - --create
      - --if-not-exists
      - --topic
      - ${KAFKA_TOPIC:-raw.ecom_records}
      - --partitions
      - "3"
      - --replication-factor
      - "1"
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-xom}:${POSTGRES_PASSWORD:-xom}@postgres:5432/${POSTGRES_DB:-xom}
      APP_VERSION: ${APP_VERSION:-dev}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-raw.ecom_records}
    ports:
      - "${API_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  consumer:
    build: .
    command: ["python", "-m", "src.ingestion.consumer"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-xom}:${POSTGRES_PASSWORD:-xom}@postgres:5432/${POSTGRES_DB:-xom}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-raw.ecom_records}
      CONSUMER_BATCH_SIZE: ${CONSUMER_BATCH_SIZE:-1000}
      CONSUMER_FLUSH_SECONDS: ${CONSUMER_FLUSH_SECONDS:-2}
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    stop_grace_period: 30s  # finishes and commits the current batch on SIGTERM
    restart: unless-stopped

  poller:
    build: .
    command: ["python", "-m", "src.source.poller"]
    environment:
      SOURCE_DATABASE_URL: postgresql://${POSTGRES_USER:-xom}:${POSTGRES_PASSWORD:-xom}@postgres:5432/xom_source
      DATABASE_URL: postgresql://${POSTGRES_USER:-xom}:${POSTGRES_PASSWORD:-xom}@postgres:5432/${POSTGRES_DB:-xom}
      API_URL: http://api:5000
      POLLER_INTERVAL_SECONDS: ${POLLER_INTERVAL_SECONDS:-5}
      POLLER_BATCH_SIZE: ${POLLER_BATCH_SIZE:-1000}
    depends_on:
      api:
        condition: service_healthy
      consumer:
        condition: service_started
    restart: unless-stopped

  transform-runner:
    build: .
    command: ["python", "-m", "src.pipeline.transform_runner"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-xom}:${POSTGRES_PASSWORD:-xom}@postgres:5432/${POSTGRES_DB:-xom}
      DBT_TARGET: ${DBT_TARGET:-dev}
      TRANSFORM_INTERVAL_SECONDS: ${TRANSFORM_INTERVAL_SECONDS:-30}
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 60s  # lets a running dbt build finish on SIGTERM
    restart: unless-stopped

volumes:
  pgdata:
  kafkadata:
