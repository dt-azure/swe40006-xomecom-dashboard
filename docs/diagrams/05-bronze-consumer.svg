<text x="68.0" y="795.0" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#374151">Uses the same envelope check as the API</text>
<text x="50.0" y="820.0" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#64748b">•</text>
<text x="68.0" y="820.0" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#374151">A message that fails the check is stored as</text>
<text x="68.0" y="845.0" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#374151">rejected; it never blocks the partition</text>
<text x="50.0" y="870.0" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#64748b">•</text>
<text x="68.0" y="870.0" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#374151">A row Postgres refuses is retried alone and</text>
<text x="68.0" y="895.0" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#374151">rejected, so the rest of the batch lands</text>
<text x="50.0" y="920.0" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#64748b">•</text>
<text x="68.0" y="920.0" text-anchor="start" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#374151">On SIGTERM: finish and commit the batch, then exit</text>
</svg>