# CI/CD for both components.
#
#   Pull request : lint, secret scan, dashboard tests, pipeline tests, then build both images
#                  and smoke-test the whole stack (Kafka, pipeline, dashboard, a local Postgres)
#   Push to main : the same, then push both images to GitHub Container Registry, deploy to
#                  the test server, and deploy to production after approval
#
# Images: ghcr.io/<owner>/xom-dashboard and ghcr.io/<owner>/xom-pipeline, tagged
# sha-<commit> (what gets deployed) and latest.
#
# Required status checks for branch protection: "Lint", "Secret scan", "Dashboard tests",
# "Pipeline tests", "Build and smoke test".
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a PR cancels the older run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RELEASE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
  RELEASE_TAG: sha-${{ github.sha }}
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      # Only ruff is needed here; take its pinned version from requirements-dev.txt.
      # Files under data_pipeline/ use data_pipeline/pyproject.toml automatically.
      - name: Install ruff
        run: pip install "$(grep -E '^ruff==' requirements-dev.txt)"

      - name: Ruff check
        run: ruff check --output-format=github .

      - name: Ruff format
        run: ruff format --check .

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so secrets in old commits are found too

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan git history
        run: gitleaks git --redact --verbose .

  dashboard-tests:
    name: Dashboard tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            dashboard/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: >-
          pytest
          --junitxml=reports/junit.xml
          --cov=dashboard
          --cov-report=term
          --cov-report=xml:reports/coverage.xml

      # Kept for the report: proof of which tests ran and passed or failed
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-test-reports
          path: reports/
          retention-days: 30

  pipeline-tests:
    name: Pipeline tests
    runs-on: ubuntu-latest
    services:
      # The tests create and drop their own throwaway databases on this server
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xom
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: xom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xom -d xom"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://xom:ci-only@localhost:5432/xom
    defaults:
      run:
        working-directory: data_pipeline
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: data_pipeline/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # tests/dashboard_serve is ignored for now: it looks for dashboard_serve/load_gold.py
      # inside data_pipeline/, but that folder moved to dashboard_server/ at the repo root,
      # and its CSV snapshot is not committed. Remove the --ignore once the test is updated.
      - name: Run tests
        run: >-
          pytest
          --ignore=tests/dashboard_serve
          --junitxml=reports/junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-test-reports
          path: data_pipeline/reports/
          retention-days: 30

  build:
    name: Build and smoke test
    needs: [lint, secret-scan, dashboard-tests, pipeline-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # only used when pushing on main
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Dashboard image tags
        id: meta-dashboard
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/xom-dashboard
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Pipeline image tags
        id: meta-pipeline
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/xom-pipeline
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # Built locally first (load: true) so the exact images are tested before they are pushed
      - name: Build dashboard image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/dashboard.Dockerfile
          load: true
          push: false
          tags: ${{ steps.meta-dashboard.outputs.tags }}
          labels: ${{ steps.meta-dashboard.outputs.labels }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

      - name: Build pipeline image
        uses: docker/build-push-action@v7
        with:
          context: data_pipeline
          load: true
          push: false
          tags: ${{ steps.meta-pipeline.outputs.tags }}
          labels: ${{ steps.meta-pipeline.outputs.labels }}
          cache-from: type=gha,scope=pipeline
          cache-to: type=gha,mode=max,scope=pipeline

      # The same compose file the servers use (deploy/compose.yml), plus a local Postgres
      # (deploy/compose.ci.yml), running the images just built.
      - name: Start stack
        env:
          DASHBOARD_IMAGE: ${{ env.IMAGE_PREFIX }}/xom-dashboard:${{ env.RELEASE_TAG }}
          PIPELINE_IMAGE: ${{ env.IMAGE_PREFIX }}/xom-pipeline:${{ env.RELEASE_TAG }}
        run: docker compose up -d --no-build

      - name: Smoke test
        env:
          EXPECTED_VERSION: ${{ env.RELEASE_TAG }}
        run: bash scripts/smoke_test.sh --api http://localhost:5000 --dashboard http://localhost:8501

      # Streamlit's health check answers even when the app's Python code fails, so also run
      # the dashboard script inside its container and fail on any exception. -P keeps the
      # working directory off sys.path, exactly like `streamlit run`. With the empty CI
      # database the app shows its "no Gold data" message, which is fine.
      - name: Render dashboard page
        run: |
          docker compose exec -T dashboard python -P -c '
          from pathlib import Path
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file(str(Path.cwd() / "dashboard" / "app.py"), default_timeout=60).run()
          if at.exception:
              raise SystemExit("Dashboard raised: " + at.exception[0].message)
          print("Dashboard rendered without exceptions")
          '

      # A service in a crash loop still shows "running" between restarts, so compare
      # restart counts across a window.
      - name: Check services stay up
        run: |
          services="kafka api consumer poller transform-runner dashboard"
          restarts() { for s in $services; do docker inspect --format '{{.RestartCount}}' "$(docker compose ps -q "$s")"; done; }
          before="$(restarts)"; sleep 30; after="$(restarts)"
          docker compose ps -a
          for s in $services; do
            state="$(docker inspect --format '{{.State.Status}}' "$(docker compose ps -q "$s")")"
            [ "$state" = running ] || { echo "::error::$s is $state"; exit 1; }
          done
          [ "$before" = "$after" ] || { echo "::error::a service restarted during the check"; exit 1; }
          echo "All services stable"

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v

      - name: Log in to GitHub Container Registry
        if: env.RELEASE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images
        if: env.RELEASE == 'true'
        env:
          TAGS: |
            ${{ steps.meta-dashboard.outputs.tags }}
            ${{ steps.meta-pipeline.outputs.tags }}
        run: echo "$TAGS" | grep . | xargs -n1 docker push

      - name: Summary
        run: |
          {
            echo "### Images (${RELEASE_TAG})"
            if [ "$RELEASE" = "true" ]; then echo "Pushed:"; else echo "Built and tested (not pushed: not on main):"; fi
            echo "- \`${IMAGE_PREFIX}/xom-dashboard:${RELEASE_TAG}\`"
            echo "- \`${IMAGE_PREFIX}/xom-pipeline:${RELEASE_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-test:
    name: Deploy to test
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: test
      release-tag: sha-${{ github.sha }}
    secrets: inherit

  deploy-production:
    name: Deploy to production
    needs: [build, deploy-test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      release-tag: sha-${{ github.sha }}
    secrets: inherit
