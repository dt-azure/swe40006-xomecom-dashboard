[project]
name = "xom-ecom"
version = "0.1.0"
description = "SWE40006 e-commerce analytics: streaming data pipeline and Streamlit dashboard"
requires-python = ">=3.13,<3.14"

# Each component has its own dependencies and image:
#   dashboard/requirements.txt      -> deploy/dashboard.Dockerfile
#   data_pipeline/requirements.txt  -> data_pipeline/Dockerfile
# This file holds the shared tool settings for the repository root. data_pipeline/ has its
# own pyproject.toml, which ruff and pytest use for files inside that folder.

[tool.pytest.ini_options]
# Dashboard tests. The pipeline's tests run from data_pipeline/ (see CONTRIBUTING.md).
testpaths = ["tests"]
# Lets tests do `from dashboard import ...`
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a Gold database (set DASHBOARD_TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["data"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, B: bugbear, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The sys.path setup has to run before the dashboard imports
"dashboard/app.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["dashboard"]

[tool.ruff.format]
quote-style = "double"
