<text x="30" y="60" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="800" fill="#1f2937">05 · Bronze consumer</text>
<text x="30" y="94" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#4b5563">Streams Kafka into bronze in micro-batches. Database commit first, Kafka offsets second, so a crash never loses a record.</text>
