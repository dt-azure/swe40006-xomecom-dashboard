# CI: runs on every pull request to main and every push to main
#
#   Pull request : lint, secret scan, tests, build image, smoke-test the stack
#   Push to main : same as above, then push the image to GitHub Container Registry
#   as ghcr.io/<owner>/<repo>:sha-<commit> and :latest

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a PR cancels the older run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PUSH_IMAGE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install ruff
        run: pip install "$(grep -E '^ruff==' requirements-dev.txt)"

      - name: Ruff check
        run: ruff check --output-format=github .

      - name: Ruff format
        run: ruff format --check .

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan git history
        run: gitleaks git --redact --verbose .

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ecommerce
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce -d ecommerce"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ci-only
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: >-
          pytest
          --junitxml=reports/junit.xml
          --cov=api --cov=pipeline --cov=dashboard
          --cov-report=term
          --cov-report=xml:reports/coverage.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: reports/
          retention-days: 30

  build:
    name: Build and smoke test
    needs: [lint, secret-scan, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # Built locally first (load: true) so the exact image is tested before it is pushed
      # ecommerce-pipeline:local is the name docker-compose.yml uses
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: |
            ${{ steps.meta.outputs.tags }}
            ecommerce-pipeline:local
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start stack
        run: docker compose up -d --no-build --wait --wait-timeout 120

      - name: Smoke test
        env:
          EXPECTED_VERSION: ${{ github.sha }}
        run: bash scripts/smoke_test.sh http://localhost:5000 http://localhost:8501

      - name: Run pipeline once
        run: docker compose run --rm pipeline

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v

      - name: Log in to GitHub Container Registry
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: env.PUSH_IMAGE == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: echo "$TAGS" | xargs -n1 docker push

      - name: Record image reference
        id: image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          ref="$(echo "$TAGS" | grep ':sha-' | head -n1)"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          {
            echo "### Image"
            if [ "$PUSH_IMAGE" = "true" ]; then echo "Pushed \`$ref\`"; else echo "Built and tested \`$ref\` (not pushed: not on main)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
