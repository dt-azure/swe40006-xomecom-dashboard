# Server stack: what runs on xom-test and xom-prod, in /opt/xom.
#
# The deploy workflow copies this file, deploy.sh and smoke_test.sh to /opt/xom and runs
#   bash /opt/xom/deploy.sh <image-prefix> <release-tag>
# which writes /opt/xom/release.env (which images to run) and starts the stack.
#
# Settings come from /opt/xom/.env, which lives only on the server (see server.env.example).
# Each container receives only the variables it needs, so the dashboard never sees the
# pipeline's read-write database password.
#
# There is no local PostgreSQL: the databases are on RDS. For a local or CI run, the root
# docker-compose.yml adds compose.ci.yml, which provides one.

name: xom

x-pipeline: &pipeline
  image: ${PIPELINE_IMAGE:-ghcr.io/dt-azure/xom-pipeline:latest}
  restart: unless-stopped
  depends_on:
    kafka-init:
      condition: service_completed_successfully

x-pipeline-env: &pipeline-env
  APP_ENV: ${APP_ENV:-}
  DATABASE_URL: ${DATABASE_URL:-}
  # dbt connects without sslmode in its profile; libpq then uses this.
  PGSSLMODE: ${PGSSLMODE:-prefer}
  KAFKA_BOOTSTRAP_SERVERS: kafka:19092
  KAFKA_TOPIC: ${KAFKA_TOPIC:-raw.ecom_records}

services:
  # One Kafka broker in KRaft mode, reachable only inside this compose network.
  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # t3.small has 2 GB RAM shared with the pipeline and the dashboard
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xmx384m -Xms384m}
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 10
    restart: unless-stopped

  # Creates the topic, then exits. Safe to re-run (--if-not-exists).
  kafka-init:
    image: apache/kafka:4.1.0
    command:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - kafka:19092
      - --create
      - --if-not-exists
      - --topic
      - ${KAFKA_TOPIC:-raw.ecom_records}
      - --partitions
      - "3"
      - --replication-factor
      - "1"
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  # Raw data API. Published on the server's loopback only, for the post-deploy smoke test.
  api:
    <<: *pipeline
    environment:
      <<: *pipeline-env
      APP_VERSION: ${RELEASE_TAG:-dev}
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  consumer:
    <<: *pipeline
    command: ["python", "-m", "src.ingestion.consumer"]
    environment:
      <<: *pipeline-env
      CONSUMER_BATCH_SIZE: ${CONSUMER_BATCH_SIZE:-1000}
      CONSUMER_FLUSH_SECONDS: ${CONSUMER_FLUSH_SECONDS:-2}
    stop_grace_period: 30s # finishes and commits the current batch on SIGTERM

  poller:
    <<: *pipeline
    command: ["python", "-m", "src.source.poller"]
    environment:
      <<: *pipeline-env
      SOURCE_DATABASE_URL: ${SOURCE_DATABASE_URL:-}
      API_URL: http://api:5000
      POLLER_INTERVAL_SECONDS: ${POLLER_INTERVAL_SECONDS:-5}
      POLLER_BATCH_SIZE: ${POLLER_BATCH_SIZE:-1000}
    depends_on:
      api:
        condition: service_healthy
      consumer:
        condition: service_started

  transform-runner:
    <<: *pipeline
    command: ["python", "-m", "src.pipeline.transform_runner"]
    environment:
      <<: *pipeline-env
      DBT_TARGET: ${DBT_TARGET:-prod}
      TRANSFORM_INTERVAL_SECONDS: ${TRANSFORM_INTERVAL_SECONDS:-30}
    stop_grace_period: 60s # lets a running dbt build finish on SIGTERM

  # Streamlit dashboard. Port 80 on the server: the test server is reached directly,
  # production only through the load balancer (security group xom-app-prod-sg).
  dashboard:
    image: ${DASHBOARD_IMAGE:-ghcr.io/dt-azure/xom-dashboard:latest}
    environment:
      APP_ENV: ${APP_ENV:-}
      DASHBOARD_DATABASE_URL: ${DASHBOARD_DATABASE_URL:-}
    ports:
      - "${DASHBOARD_PORT:-80}:8501"
    restart: unless-stopped

volumes:
  kafkadata:
